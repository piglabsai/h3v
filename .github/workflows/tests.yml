name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the packaged library
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --outdir build/release
          python -m twine check --strict build/release/*
          python -c "import pathlib, subprocess, sys; wheel, = pathlib.Path('build/release').glob('*.whl'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel)])"
          python -m pip check
      - name: Check release contents and installed README examples
        run: python -I tools/check_release.py build/release
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os, importlib.metadata; tag = os.environ['GITHUB_REF_NAME']; version = importlib.metadata.version('h3v'); assert tag == 'v' + version, (tag, version)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - name: Test documentation examples
        run: python -m sphinx -b doctest -n -W --keep-going docs docs/_build/doctest
      - name: Save rendered documentation for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
