name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the packaged library
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --wheel-dir dist
          python -m pip install --no-index --find-links dist h3v==0.1.0
          python -m pip check
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os, importlib.metadata; tag = os.environ['GITHUB_REF_NAME']; version = importlib.metadata.version('h3v'); assert tag == 'v' + version, (tag, version)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - name: Test documentation examples
        run: python -m sphinx -b doctest -n -W --keep-going docs docs/_build/doctest
